<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فوتبال آنلاین - مستر لیگ</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-purple: #7b2cbf;
            --accent-pink: #ff007f;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #1a103c, #2b1055);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- افکت شیشه‌ای (Glassmorphism UI) --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        h2, h3 {
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d1d1d1;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary-purple), var(--accent-pink));
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        /* --- صفحه داشبورد و تنظیمات تیم --- */
        #dashboard-screen, #match-screen {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 15px 25px;
        }

        .pitch-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: repeating-linear-gradient(
                0deg,
                #2e7d32,
                #2e7d32 40px,
                #256327 40px,
                #256327 80px
            );
            border: 4px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* خطوط زمین فوتبال */
        .pitch-line-center {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
        }

        .pitch-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        /* کیت (بازیکنان) */
        .player-kit {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .player-power {
            position: absolute;
            bottom: -15px;
            font-size: 9px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* --- صفحه بازی --- */
        .match-scorebar {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ball {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid #000;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #match-log {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 10px;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            text-align: right;
            border: 1px solid var(--glass-border);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ۱. منوی اولیه ساخت تیم (Glassmorphism) -->
    <div id="create-team-screen" class="glass-card">
        <h2>ساخت تیم جدید</h2>
        <div class="form-group">
            <label>نام تیم:</label>
            <input type="text" id="team-name-input" value="تیم ستاره‌ها" maxlength="15">
        </div>
        <div class="form-group">
            <label>رنگ لباس (کیت):</label>
            <input type="color" id="team-color-input" value="#ff0055">
        </div>
        <button class="btn" onclick="createTeam()">ایجاد تیم و ورود</button>
    </div>

    <!-- ۲. داشبورد و تنظیمات تیم -->
    <div id="dashboard-screen">
        <div class="glass-card dashboard-header">
            <div>
                <h3 id="dash-team-name" style="margin:0;">-</h3>
                <small id="dash-team-power" style="color: #ff007f;">قدرت کلی: ۰</small>
            </div>
            <div style="display: flex; gap: 10px;">
                <select id="formation-select" onchange="updateTactics()">
                    <option value="4-4-2">ترکیب: ۴-۴-۲</option>
                    <option value="4-3-3">ترکیب: ۴-۳-۳</option>
                    <option value="3-5-2">ترکیب: ۳-۵-۲</option>
                    <option value="5-3-2">ترکیب: ۵-۳-۲</option>
                </select>
                <select id="style-select" onchange="updateTactics()">
                    <option value="balanced">تاکتیک: متعادل</option>
                    <option value="attacking">تاکتیک: هجومی</option>
                    <option value="defensive">تاکتیک: دفاعی</option>
                </select>
            </div>
        </div>

        <!-- پیش‌نمایش زمین چمن -->
        <div class="pitch-container" id="preview-pitch">
            <div class="pitch-line-center"></div>
            <div class="pitch-circle"></div>
        </div>

        <button class="btn" style="margin-top: 15px; width: 100%; max-width: 400px;" onclick="startMatchmaking()">
            ⚡ جستجوی حریف آنلاین (Matchmaking)
        </button>
    </div>

    <!-- ۳. صفحه بازی آنلاین -->
    <div id="match-screen">
        <div class="match-scorebar">
            <div id="home-team-display" style="color: #ff0055;">تیم من: ۰</div>
            <div id="match-timer" style="color: #ffcc00;">نیمه اول | 01:00</div>
            <div id="away-team-display" style="color: #00ccff;">حریف: ۰</div>
        </div>

        <div class="pitch-container" id="match-pitch">
            <div class="pitch-line-center"></div>
            <div class="pitch-circle"></div>
            <div id="ball" class="ball"></div>
        </div>

        <div id="match-log"></div>
    </div>

    <script>
        // اتصال به Supabase Realtime
        const SUPABASE_URL = 'https://vxpybengqnalhiriqspz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-GdIgi3ei9hEnccdjpFY6g_z88xdCa5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myTeam = {
            name: '',
            color: '#ff0055',
            players: [],
            totalPower: 0,
            formation: '4-4-2',
            style: 'balanced'
        };

        let opponentTeam = null;
        let matchChannel = null;
        let isHost = false;
        let half = 1;
        let timer = 60;
        let score = { home: 0, away: 0 };
        let matchInterval = null;

        // ساخت تیم و ۱۱ بازیکن با قدرت رندوم (۲ تا ۴)
        function createTeam() {
            const name = document.getElementById('team-name-input').value.trim();
            if(!name) return alert('لطفاً نام تیم را وارد کنید');

            myTeam.name = name;
            myTeam.color = document.getElementById('team-color-input').value;
            myTeam.players = [];
            myTeam.totalPower = 0;

            // ساخت ۱۱ بازیکن
            for (let i = 1; i <= 11; i++) {
                // قدرت رندوم اعشاری بین ۲.۰ تا ۴.۰ برای دقت بیشتر
                let pPower = parseFloat((Math.random() * 2 + 2).toFixed(1));
                myTeam.players.push({
                    id: i,
                    power: pPower,
                    role: i === 1 ? 'GK' : (i <= 5 ? 'DEF' : (i <= 9 ? 'MID' : 'FWD'))
                });
                myTeam.totalPower += pPower;
            }

            myTeam.totalPower = parseFloat(myTeam.totalPower.toFixed(1));

            // نمایش داشبورد
            document.getElementById('create-team-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'flex';
            document.getElementById('dash-team-name').innerText = myTeam.name;
            document.getElementById('dash-team-power').innerText = `قدرت کلی تیم: ${myTeam.totalPower}`;

            renderPreviewPitch();
        }

        // تغییر تاکتیک‌ها
        function updateTactics() {
            myTeam.formation = document.getElementById('formation-select').value;
            myTeam.style = document.getElementById('style-select').value;
            renderPreviewPitch();
        }

        // محاسبه مختصات ۱۱ بازیکن روی زمین بر اساس ترکیب و تاکتیک
        function getCoordinates(formation, style, isOpponent = false) {
            let coords = [];
            // دروازه‌بان
            coords.push({ x: 50, y: isOpponent ? 5 : 95 });

            let formParts = formation.split('-').map(Number); // مثلا [4, 4, 2]
            let yOffset = style === 'attacking' ? -5 : (style === 'defensive' ? 5 : 0);
            if(isOpponent) yOffset = -yOffset;

            let currentY = isOpponent ? 20 : 80;
            let stepY = isOpponent ? 25 : -25;

            let playerIdx = 2;
            formParts.forEach(lineCount => {
                let stepX = 100 / (lineCount + 1);
                for (let i = 1; i <= lineCount; i++) {
                    let finalY = currentY + yOffset;
                    coords.push({ x: stepX * i, y: finalY });
                    playerIdx++;
                }
                currentY += stepY;
            });

            return coords;
        }

        // رسم پیش‌نمایش زمین در داشبورد
        function renderPreviewPitch() {
            const pitch = document.getElementById('preview-pitch');
            // پاکسازی کیت‌های قبلی
            pitch.querySelectorAll('.player-kit').forEach(el => el.remove());

            let coords = getCoordinates(myTeam.formation, myTeam.style);

            myTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = myTeam.color;
                kit.style.left = `${coords[idx].x}%`;
                kit.style.top = `${coords[idx].y}%`;
                kit.innerHTML = `${p.id} <span class="player-power">${p.power}</span>`;
                pitch.appendChild(kit);
            });
        }

        // شبکه آنلاین و جستجوی حریف (Matchmaking)
        function startMatchmaking() {
            alert('در حال جستجوی حریف آنلاین... لطفاً منتظر بمانید.');
            
            const matchId = 'lobby_room_global';
            matchChannel = supabaseClient.channel(matchId, {
                config: { presence: { key: myTeam.name } }
            });

            matchChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = matchChannel.presenceState();
                    const players = Object.keys(state);

                    if (players.length >= 2) {
                        // یافتن حریف
                        let keys = Object.keys(state);
                        if (keys[0] === myTeam.name) {
                            isHost = true;
                            opponentTeam = state[keys[1]][0].team;
                        } else {
                            isHost = false;
                            opponentTeam = state[keys[0]][0].team;
                        }

                        startMatch();
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await matchChannel.track({ team: myTeam });
                    }
                });
        }

        // شروع مسابقه آنلاین
        function startMatch() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('match-screen').style.display = 'flex';

            document.getElementById('home-team-display').innerText = `${myTeam.name}: ۰`;
            document.getElementById('away-team-display').innerText = `${opponentTeam.name}: ۰`;

            logEvent(`مسابقه بین ${myTeam.name} (قدرت: ${myTeam.totalPower}) و ${opponentTeam.name} (قدرت: ${opponentTeam.totalPower}) شروع شد!`);

            renderMatchPitch();

            if (isHost) {
                matchInterval = setInterval(gameLoopHost, 1000);
            }
        }

        // رسم بازیکنان دو تیم روی زمین مسابقه
        function renderMatchPitch() {
            const pitch = document.getElementById('match-pitch');
            pitch.querySelectorAll('.player-kit').forEach(el => el.remove());

            // تیم خودم (پایین)
            let myCoords = getCoordinates(myTeam.formation, myTeam.style, half === 2);
            myTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = myTeam.color;
                kit.style.left = `${myCoords[idx].x}%`;
                kit.style.top = `${myCoords[idx].y}%`;
                kit.innerHTML = `${p.id}`;
                pitch.appendChild(kit);
            });

            // تیم حریف (بالا)
            let oppCoords = getCoordinates(opponentTeam.formation, opponentTeam.style, half === 1);
            opponentTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = opponentTeam.color;
                kit.style.left = `${oppCoords[idx].x}%`;
                kit.style.top = `${oppCoords[idx].y}%`;
                kit.innerHTML = `${p.id}`;
                pitch.appendChild(kit);
            });
        }

        // موتور شبیه‌سازی مسابقه (در سمت میزبان اجرا می‌شود)
        function gameLoopHost() {
            timer--;

            let minutes = Math.floor(timer / 60).toString().padStart(2, '0');
            let seconds = (timer % 60).toString().padStart(2, '0');
            document.getElementById('match-timer').innerText = `نیمه ${half === 1 ? 'اول' : 'دوم'} | ${minutes}:${seconds}`;

            // حرکت تصادفی توپ
            let ball = document.getElementById('ball');
            ball.style.left = `${Math.floor(Math.random() * 80 + 10)}%`;
            ball.style.top = `${Math.floor(Math.random() * 80 + 10)}%`;

            // احتمال گلزنی بر اساس قدرت کلی تیم‌ها و تاکتیک‌ها
            if (timer % 5 === 0) { // هر ۵ ثانیه احتمال حمله
                let attackPowerHome = myTeam.totalPower * (myTeam.style === 'attacking' ? 1.2 : 1.0);
                let defensePowerAway = opponentTeam.totalPower * (opponentTeam.style === 'defensive' ? 1.2 : 1.0);

                // شانس گلزنی تیم من
                if (Math.random() * attackPowerHome > Math.random() * defensePowerAway + 15) {
                    score.home++;
                    logEvent(`⚽️ گل برای ${myTeam.name}! یک حمله عالی با موفقیت به گل تبدیل شد.`);
                    updateScores();
                }

                // شانس گلزنی تیم حریف
                let attackPowerAway = opponentTeam.totalPower * (opponentTeam.style === 'attacking' ? 1.2 : 1.0);
                let defensePowerHome = myTeam.totalPower * (myTeam.style === 'defensive' ? 1.2 : 1.0);

                if (Math.random() * attackPowerAway > Math.random() * defensePowerHome + 15) {
                    score.away++;
                    logEvent(`⚽️ گل برای ${opponentTeam.name}! حریف دروازه را باز کرد.`);
                    updateScores();
                }
            }

            // پایان نیمه اول
            if (timer <= 0 && half === 1) {
                half = 2;
                timer = 60;
                logEvent(`🔔 پایان نیمه اول. تعویض زمین انجام شد!`);
                renderMatchPitch();
            } 
            // پایان بازی
            else if (timer <= 0 && half === 2) {
                clearInterval(matchInterval);
                let resultText = score.home > score.away ? 'پیروز شدید! 🏆' : (score.home < score.away ? 'شکست خوردید! ❌' : 'بازی مساوی شد! 🤝');
                logEvent(`🏁 پایان بازی! نتیجه نهایی: ${score.home} - ${score.away}. ${resultText}`);
                alert(`بازی به پایان رسید!\nنتیجه: ${myTeam.name} ${score.home} - ${score.away} ${opponentTeam.name}`);
            }
        }

        function updateScores() {
            document.getElementById('home-team-display').innerText = `${myTeam.name}: ${score.home}`;
            document.getElementById('away-team-display').innerText = `${opponentTeam.name}: ${score.away}`;
        }

        function logEvent(msg) {
            const log = document.getElementById('match-log');
            log.innerHTML += `<div>• ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
