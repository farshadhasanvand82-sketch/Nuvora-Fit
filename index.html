<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماشای مشترک فیلم - Watch Together</title>
    <!-- بارگذاری کتابخانه‌های فایربیس (نسخه سازگار با Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary: #ff6584;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff8fab;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* نسبت 16:9 */
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        video, iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .error-msg {
            color: #ff4d4d;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش ورود یا ساخت اتاق -->
        <div id="auth-section">
            <h3>ساخت یا ورود به اتاق مشترک</h3>
            <div class="form-group">
                <label>نام اتاق:</label>
                <input type="text" id="room-name" placeholder="مثلاً: love-room">
            </div>
            <div class="form-group">
                <label>رمز عبور اتاق:</label>
                <input type="password" id="room-pass" placeholder="رمز عبور محرمانه">
            </div>
            <button onclick="joinOrCreateRoom()">ورود / ساخت اتاق</button>
            <div id="error-box" class="error-msg"></div>
        </div>

        <!-- بخش اصلی پلیر و تماشای فیلم -->
        <div id="room-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="room-title-display" style="margin: 0;">اتاق: </h3>
                <button onclick="leaveRoom()" style="width: auto; padding: 5px 15px; background: #e74c3c; margin: 0;">خروج</button>
            </div>

            <div class="controls-bar">
                <input type="text" id="video-url-input" placeholder="لینک مستقیم ویدیو (mp4, mkv...) را وارد کنید">
                <button onclick="updateVideoUrl()" style="width: 150px; margin-top: 0;">تغییر فیلم</button>
            </div>

            <div class="player-container">
                <video id="sync-video" controls playsinline></video>
            </div>
        </div>
    </div>

    <script>
        // تنظیمات اتصال به دیتابیس فایربیس شما[span_1](start_span)[span_1](end_span)
        const firebaseConfig = {
            databaseURL: "https://crazyapp-9663a-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomKey = null;
        let isSyncing = پرتره; // جلوگیری از لوپ بی‌فایده رویدادها
        let localChange = false;

        const authSection = document.getElementById('auth-section');
        const roomSection = document.getElementById('room-section');
        const roomInput = document.getElementById('room-name');
        const passInput = document.getElementById('room-pass');
        const errorBox = document.getElementById('error-box');
        const videoInput = document.getElementById('video-url-input');
        const videoPlayer = document.getElementById('sync-video');
        const roomTitleDisplay = document.getElementById('room-title-display');

        // تبدیل نام اتاق به کلید امن برای دیتابیس
        function sanitizeRoomName(name) {
            return name.trim().replace(/[.#$\/\[\]]/g, "_");
        }

        function joinOrCreateRoom() {
            const roomName = roomInput.value.trim();
            const password = passInput.value.trim();

            if (!roomName || !password) {
                errorBox.innerText = "لطفاً نام اتاق و رمز عبور را وارد کنید.";
                return;
            }

            const roomKey = sanitizeRoomName(roomName);
            const roomRef = db.ref('rooms/' + roomKey);

            roomRef.once('value', (snapshot) => {
                const roomData = snapshot.val();

                if (roomData) {
                    // اتاق وجود دارد، بررسی رمز عبور
                    if (roomData.password === password) {
                        enterRoom(roomKey, roomName, roomData);
                    } else {
                        errorBox.innerText = "رمز عبور اشتباه است!";
                    }
                } else {
                    // ساخت اتاق جدید
                    const newRoomData = {
                        password: password,
                        videoUrl: "",
                        currentTime: 0,
                        paused: true,
                        lastUpdated: Date.now()
                    };
                    roomRef.set(newRoomData).then(() => {
                        enterRoom(roomKey, roomName, newRoomData);
                    });
                }
            });
        }

        function enterRoom(key, name, data) {
            currentRoomKey = key;
            authSection.classList.add('hidden');
            roomSection.classList.remove('hidden');
            roomTitleDisplay.innerText = `اتاق: ${name}`;

            if (data.videoUrl) {
                videoPlayer.src = data.videoUrl;
                videoPlayer.currentTime = data.currentTime || 0;
            }

            listenToRoomUpdates();
        }

        function updateVideoUrl() {
            const url = videoInput.value.trim();
            if (!url || !currentRoomKey) return;

            db.ref('rooms/' + currentRoomKey).update({
                videoUrl: url,
                currentTime: 0,
                paused: true,
                lastUpdated: Date.now()
            });
        }

        // گوش دادن به تغییرات دیتابیس برای همگام‌سازی لحظه‌ای
        function listenToRoomUpdates() {
            const roomRef = db.ref('rooms/' + currentRoomKey);

            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // تغییر لینک ویدیو اگر متفاوت بود
                if (data.videoUrl && videoPlayer.src !== data.videoUrl) {
                    videoPlayer.src = data.videoUrl;
                }

                isSyncing = true;
                // همگام‌سازی وضعیت Play/Pause
                if (data.paused && !videoPlayer.paused) {
                    videoPlayer.pause();
                } else if (!data.paused && videoPlayer.paused) {
                    videoPlayer.play().catch(e => console.log(e));
                }

                // همگام‌سازی زمان ویدیو (اگر اختلاف بیشتر از ۱.۵ ثانیه بود)
                if (Math.abs(videoPlayer.currentTime - data.currentTime) > 1.5) {
                    videoPlayer.currentTime = data.currentTime;
                }
                isSyncing = false;
            });

            // ارسال رویدادهای پلیر کاربر به فایربیس
            videoPlayer.onplay = () => {
                if (isSyncing) return;
                db.ref('rooms/' + currentRoomKey).update({
                    paused: false,
                    currentTime: videoPlayer.currentTime,
                    lastUpdated: Date.now()
                });
            };

            videoPlayer.onpause = () => {
                if (isSyncing) return;
                db.ref('rooms/' + currentRoomKey).update({
                    paused: true,
                    currentTime: videoPlayer.currentTime,
                    lastUpdated: Date.now()
                });
            };

            videoPlayer.onseeked = () => {
                if (isSyncing) return;
                db.ref('rooms/' + currentRoomKey).update({
                    currentTime: videoPlayer.currentTime,
                    lastUpdated: Date.now()
                });
            };
        }

        function leaveRoom() {
            if (currentRoomKey) {
                db.ref('rooms/' + currentRoomKey).off();
            }
            location.reload();
        }
    </script>
</body>
</html>
