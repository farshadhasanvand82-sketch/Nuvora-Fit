<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فوتبال آنلاین - مستر لیگ</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-purple: #7b2cbf;
            --accent-pink: #ff007f;
            --glass-bg: rgba(25, 20, 45, 0.8);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #090712, #150b2e, #200d42);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        h2, h3 {
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #d1d1d1;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        input[type="color"] {
            width: 100%;
            height: 45px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary-purple), var(--accent-pink));
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        #dashboard-screen, #match-screen {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding: 15px 25px;
        }

        .pitch-container {
            position: relative;
            width: 100%;
            height: 480px;
            background: repeating-linear-gradient(
                0deg,
                #236b27,
                #236b27 40px,
                #1d5a21 40px,
                #1d5a21 80px
            );
            border: 4px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pitch-line-center {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
        }

        .pitch-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        .player-kit {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .player-power {
            position: absolute;
            bottom: -15px;
            font-size: 9px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* مودال شیشه‌ای جستجوی حریف با دایره چرخان */
        #search-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .search-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 350px;
            width: 90%;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--accent-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .match-scorebar {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ball {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            border: 2px solid #000;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #match-log {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            margin-top: 10px;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            text-align: right;
            border: 1px solid var(--glass-border);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ۱. منوی اولیه ساخت تیم -->
    <div id="create-team-screen" class="glass-card">
        <h2>ساخت تیم جدید</h2>
        <div class="form-group">
            <label>نام تیم:</label>
            <input type="text" id="team-name-input" value="تیم ستاره‌ها" maxlength="15">
        </div>
        <div class="form-group">
            <label>رنگ لباس (کیت):</label>
            <input type="color" id="team-color-input" value="#ff0055">
        </div>
        <button class="btn" onclick="createTeam()">ایجاد تیم و ورود</button>
    </div>

    <!-- ۲. داشبورد و تنظیمات تیم -->
    <div id="dashboard-screen">
        <div class="glass-card dashboard-header">
            <div>
                <h3 id="dash-team-name" style="margin:0;">-</h3>
                <small id="dash-team-power" style="color: var(--accent-pink);">قدرت کلی: ۰</small>
            </div>
            <div style="display: flex; gap: 10px;">
                <select id="formation-select" onchange="updateTactics()">
                    <option value="4-4-2">ترکیب: ۴-۴-۲</option>
                    <option value="4-3-3">ترکیب: ۴-۳-۳</option>
                    <option value="3-5-2">ترکیب: ۳-۵-۲</option>
                    <option value="5-3-2">ترکیب: ۵-۳-۲</option>
                </select>
                <select id="style-select" onchange="updateTactics()">
                    <option value="balanced">تاکتیک: متعادل</option>
                    <option value="attacking">تاکتیک: هجومی</option>
                    <option value="defensive">تاکتیک: دفاعی</option>
                </select>
            </div>
        </div>

        <div class="pitch-container" id="preview-pitch">
            <div class="pitch-line-center"></div>
            <div class="pitch-circle"></div>
        </div>

        <button class="btn" style="margin-top: 15px; width: 100%; max-width: 400px;" onclick="startMatchmaking()">
            ⚡ جستجوی حریف آنلاین (Matchmaking)
        </button>
    </div>

    <!-- مودال شیشه‌ای جستجوی حریف -->
    <div id="search-modal">
        <div class="search-box">
            <div class="spinner"></div>
            <h3 style="margin:0; font-size: 18px;">در حال جستجوی حریف...</h3>
            <p style="font-size: 12px; color: #ccc;">لطفاً منتظر بمانید تا بازیکن دیگری متصل شود.</p>
            <button class="btn" style="background: rgba(255,255,255,0.1); margin-top:0;" onclick="cancelMatchmaking()">لغو جستجو</button>
        </div>
    </div>

    <!-- ۳. صفحه بازی آنلاین -->
    <div id="match-screen">
        <div class="match-scorebar">
            <div id="home-team-display" style="color: #ff0055;">تیم من: ۰</div>
            <div id="match-timer" style="color: #ffcc00;">نیمه اول | 01:00</div>
            <div id="away-team-display" style="color: #00ccff;">حریف: ۰</div>
        </div>

        <div class="pitch-container" id="match-pitch">
            <div class="pitch-line-center"></div>
            <div class="pitch-circle"></div>
            <div id="ball" class="ball"></div>
        </div>

        <div id="match-log"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vxpybengqnalhiriqspz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-GdIgi3ei9hEnccdjpFY6g_z88xdCa5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myTeam = {
            id: 'player_' + Math.random().toString(36).substr(2, 9),
            name: '',
            color: '#ff0055',
            players: [],
            totalPower: 0,
            formation: '4-4-2',
            style: 'balanced'
        };

        let opponentTeam = null;
        let isHost = false;
        let half = 1;
        let timer = 60;
        let score = { home: 0, away: 0 };
        let matchInterval = null;
        let myQueueId = null;

        function createTeam() {
            const name = document.getElementById('team-name-input').value.trim();
            if(!name) return alert('لطفاً نام تیم را وارد کنید');

            myTeam.name = name;
            myTeam.color = document.getElementById('team-color-input').value;
            myTeam.players = [];
            myTeam.totalPower = 0;

            for (let i = 1; i <= 11; i++) {
                let pPower = parseFloat((Math.random() * 2 + 2).toFixed(1));
                myTeam.players.push({
                    id: i,
                    power: pPower,
                    role: i === 1 ? 'GK' : (i <= 5 ? 'DEF' : (i <= 9 ? 'MID' : 'FWD'))
                });
                myTeam.totalPower += pPower;
            }
            myTeam.totalPower = parseFloat(myTeam.totalPower.toFixed(1));

            document.getElementById('create-team-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'flex';
            document.getElementById('dash-team-name').innerText = myTeam.name;
            document.getElementById('dash-team-power').innerText = `قدرت کلی تیم: ${myTeam.totalPower}`;

            renderPreviewPitch();
        }

        function updateTactics() {
            myTeam.formation = document.getElementById('formation-select').value;
            myTeam.style = document.getElementById('style-select').value;
            renderPreviewPitch();
        }

        function getCoordinates(formation, style, isOpponent = false) {
            let coords = [{ x: 50, y: isOpponent ? 5 : 95 }];
            let formParts = formation.split('-').map(Number);
            let yOffset = style === 'attacking' ? -5 : (style === 'defensive' ? 5 : 0);
            if(isOpponent) yOffset = -yOffset;

            let currentY = isOpponent ? 20 : 80;
            let stepY = isOpponent ? 25 : -25;

            formParts.forEach(lineCount => {
                let stepX = 100 / (lineCount + 1);
                for (let i = 1; i <= lineCount; i++) {
                    coords.push({ x: stepX * i, y: currentY + yOffset });
                }
                currentY += stepY;
            });
            return coords;
        }

        function renderPreviewPitch() {
            const pitch = document.getElementById('preview-pitch');
            pitch.querySelectorAll('.player-kit').forEach(el => el.remove());
            let coords = getCoordinates(myTeam.formation, myTeam.style);

            myTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = myTeam.color;
                kit.style.left = `${coords[idx].x}%`;
                kit.style.top = `${coords[idx].y}%`;
                kit.innerHTML = `${p.id} <span class="player-power">${p.power}</span>`;
                pitch.appendChild(kit);
            });
        }

        // سیستم مچ‌میکینگ کاملاً پایدار مبتنی بر دیتابیس Supabase
        async function startMatchmaking() {
            document.getElementById('search-modal').style.display = 'flex';

            // ۱. بررسی اینکه آیا کسی در صف انتظار هست یا خیر
            const { data: existingQueue, error: fetchError } = await supabaseClient
                .from('matchmaking_queue')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(1);

            if (existingQueue && existingQueue.length > 0) {
                // حریف پیدا شد! نفر اول را از صف بردار و بازی را شروع کن
                let opponentRecord = existingQueue[0];
                
                // مطمئن شو خودمان نیستیم
                if (opponentRecord.player_data.id !== myTeam.id) {
                    opponentTeam = opponentRecord.player_data;
                    isHost = true; // کسی که حریف را پیدا کرده میزبان است

                    // حذف از صف
                    await supabaseClient.from('matchmaking_queue').delete().eq('id', opponentRecord.id);

                    startMatch();
                    return;
                }
            }

            // ۲. اگر کسی نبود، خودمان را در صف انتظار قرار می‌دهیم
            const { data: inserted, error: insertError } = await supabaseClient
                .from('matchmaking_queue')
                .insert([{ player_data: myTeam }])
                .select();

            if (inserted && inserted.length > 0) {
                myQueueId = inserted[0].id;
            }

            // ۳. گوش دادن به جدول صف برای اینکه ببینیم کسی ما را برداشت یا حریفی آمد
            window.queueChannel = supabaseClient.channel('db_matchmaking')
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'matchmaking_queue' }, (payload) => {
                    // اگر رکورد ما از صف حذف شد یعنی کسی با ما مچ شده
                    if (myQueueId && payload.old.id === myQueueId) {
                        // دریافت اطلاعات حریف از طریق Broadcast یا چک کردن آخرین وضعیت
                    }
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'matchmaking_queue' }, async (payload) => {
                    // اگر کسی جدید آمد و ما زودتر در صف بودیم
                    if (payload.new.player_data.id !== myTeam.id) {
                        // بررسی کنیم آیا ما اولین نفر صف هستیم
                        const { data: qCheck } = await supabaseClient
                            .from('matchmaking_queue')
                            .select('*')
                            .order('created_at', { ascending: true })
                            .limit(1);

                        if (qCheck && qCheck.length > 0 && qCheck[0].player_data.id === myTeam.id) {
                            opponentTeam = payload.new.player_data;
                            isHost = false; // مهمان

                            // پاک کردن هر دو از صف
                            await supabaseClient.from('matchmaking_queue').delete().eq('id', qCheck[0].id);
                            await supabaseClient.from('matchmaking_queue').delete().eq('id', payload.new.id);

                            if(window.queueChannel) supabaseClient.removeChannel(window.queueChannel);
                            startMatch();
                        }
                    }
                })
                .subscribe();
        }

        async function cancelMatchmaking() {
            if (myQueueId) {
                await supabaseClient.from('matchmaking_queue').delete().eq('id', myQueueId);
                myQueueId = null;
            }
            if (window.queueChannel) {
                supabaseClient.removeChannel(window.queueChannel);
            }
            document.getElementById('search-modal').style.display = 'none';
        }

        function startMatch() {
            document.getElementById('search-modal').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('match-screen').style.display = 'flex';

            document.getElementById('home-team-display').innerText = `${myTeam.name}: ۰`;
            document.getElementById('away-team-display').innerText = `${opponentTeam.name}: ۰`;

            logEvent(`مسابقه بین ${myTeam.name} و ${opponentTeam.name} آغاز شد!`);
            renderMatchPitch();

            if (isHost) {
                matchInterval = setInterval(gameLoopHost, 1000);
            }
        }

        function renderMatchPitch() {
            const pitch = document.getElementById('match-pitch');
            pitch.querySelectorAll('.player-kit').forEach(el => el.remove());

            let myCoords = getCoordinates(myTeam.formation, myTeam.style, half === 2);
            myTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = myTeam.color;
                kit.style.left = `${myCoords[idx].x}%`;
                kit.style.top = `${myCoords[idx].y}%`;
                kit.innerHTML = `${p.id}`;
                pitch.appendChild(kit);
            });

            let oppCoords = getCoordinates(opponentTeam.formation, opponentTeam.style, half === 1);
            opponentTeam.players.forEach((p, idx) => {
                let kit = document.createElement('div');
                kit.className = 'player-kit';
                kit.style.backgroundColor = opponentTeam.color;
                kit.style.left = `${oppCoords[idx].x}%`;
                kit.style.top = `${oppCoords[idx].y}%`;
                kit.innerHTML = `${p.id}`;
                pitch.appendChild(kit);
            });
        }

        function gameLoopHost() {
            timer--;
            let minutes = Math.floor(timer / 60).toString().padStart(2, '0');
            let seconds = (timer % 60).toString().padStart(2, '0');
            document.getElementById('match-timer').innerText = `نیمه ${half === 1 ? 'اول' : 'دوم'} | ${minutes}:${seconds}`;

            let ball = document.getElementById('ball');
            ball.style.left = `${Math.floor(Math.random() * 80 + 10)}%`;
            ball.style.top = `${Math.floor(Math.random() * 80 + 10)}%`;

            if (timer % 5 === 0) {
                let attackHome = myTeam.totalPower * (myTeam.style === 'attacking' ? 1.2 : 1.0);
                let defenseAway = opponentTeam.totalPower * (opponentTeam.style === 'defensive' ? 1.2 : 1.0);

                if (Math.random() * attackHome > Math.random() * defenseAway + 14) {
                    score.home++;
                    logEvent(`⚽️ گل برای ${myTeam.name}!`);
                    updateScores();
                }

                let attackAway = opponentTeam.totalPower * (opponentTeam.style === 'attacking' ? 1.2 : 1.0);
                let defenseHome = myTeam.totalPower * (myTeam.style === 'defensive' ? 1.2 : 1.0);

                if (Math.random() * attackAway > Math.random() * defenseHome + 14) {
                    score.away++;
                    logEvent(`⚽️ گل برای ${opponentTeam.name}!`);
                    updateScores();
                }
            }

            if (timer <= 0 && half === 1) {
                half = 2;
                timer = 60;
                logEvent(`🔔 پایان نیمه اول. تعویض زمین!`);
                renderMatchPitch();
            } else if (timer <= 0 && half === 2) {
                clearInterval(matchInterval);
                let resultText = score.home > score.away ? 'پیروز شدید! 🏆' : (score.home < score.away ? 'شکست خوردید! ❌' : 'مساوی! 🤝');
                logEvent(`🏁 پایان بازی! ${resultText}`);
            }
        }

        function updateScores() {
            document.getElementById('home-team-display').innerText = `${myTeam.name}: ${score.home}`;
            document.getElementById('away-team-display').innerText = `${opponentTeam.name}: ${score.away}`;
        }

        function logEvent(msg) {
            const log = document.getElementById('match-log');
            log.innerHTML += `<div>• ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
