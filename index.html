<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماشای مشترک فیلم - ZEUC TV</title>
    <!-- فایربیس -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- پلیر Plyr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b1b2f, #150f1d);
            --glass-bg: rgba(255, 182, 193, 0.05);
            --glass-border: rgba(255, 192, 203, 0.2);
            --primary-pink: #ff8fab;
            --primary-hover: #ff758c;
            --text-color: #ffffff;
            --plyr-color-main: #ff8fab;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background: var(--bg-gradient);
            background-color: #150f1d;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(255, 143, 175, 0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-pink);
            font-size: 22px;
            text-shadow: 0 2px 10px rgba(255, 143, 175, 0.3);
        }

        .tab-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: #ffb3c6;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff758c, #ff8fab);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ffb3c6;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 10px rgba(255, 143, 175, 0.2);
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #ff758c, #ff8fab);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
        }

        button.action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        .player-container, .iframe-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            position: relative;
        }

        .iframe-container {
            padding-top: 56.25%;
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            font-size: 13px;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .badge {
            background: rgba(255, 143, 175, 0.15);
            color: #ff8fab;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255, 143, 175, 0.3);
        }

        .plyr {
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش احراز هویت و تفکیک تب‌ها -->
        <div id="auth-section">
            <h3>تماشای مشترک فیلم</h3>
            <div class="tab-buttons">
                <button id="btn-create-tab" class="tab-btn active" onclick="switchTab('create')">ساخت اتاق جدید</button>
                <button id="btn-join-tab" class="tab-btn" onclick="switchTab('join')">ورود به اتاق</button>
            </div>

            <!-- فرم ساخت اتاق -->
            <div id="create-form">
                <div class="form-group">
                    <label>نام اتاق جدید (انگلیسی):</label>
                    <input type="text" id="create-room-name" placeholder="مثلاً: room1">
                </div>
                <div class="form-group">
                    <label>رمز عبور اختصاصی:</label>
                    <input type="password" id="create-room-pass" placeholder="رمز عبور">
                </div>
                <button class="action-btn" onclick="createRoom()">ساخت فوری اتاق</button>
            </div>

            <!-- فرم ورود به اتاق -->
            <div id="join-form" class="hidden">
                <div class="form-group">
                    <label>نام اتاق مورد نظر:</label>
                    <input type="text" id="join-room-name" placeholder="نام اتاق">
                </div>
                <div class="form-group">
                    <label>رمز عبور اتاق:</label>
                    <input type="password" id="join-room-pass" placeholder="رمز عبور">
                </div>
                <button class="action-btn" onclick="joinRoom()">ورود به اتاق</button>
            </div>

            <div id="error-box" class="error-msg hidden"></div>
        </div>

        <!-- محیط اتاق و پلیر ویدیو -->
        <div id="room-section" class="hidden">
            <div class="room-header">
                <div>
                    <h3 id="room-title-display" style="margin: 0 0 5px 0; text-align: right;">اتاق: </h3>
                    <span class="badge" id="online-users-badge">👥 افراد حاضر: ۱ نفر</span>
                </div>
                <button onclick="leaveRoom()" style="width: auto; padding: 8px 16px; background: rgba(255, 107, 107, 0.2); border:1px solid rgba(255, 107, 107, 0.4); color:#ff8fab; border-radius:10px; cursor:pointer; font-weight:bold;">خروج</button>
            </div>

            <div class="controls-bar">
                <input type="text" id="video-url-input" placeholder="لینک مستقیم ویدیو (mp4) یا لینک آپارات/یوتیوب">
                <button onclick="updateVideoUrl()" style="width: 140px; margin-top: 0; background:linear-gradient(135deg, #ff758c, #ff8fab); border:none; color:#fff; border-radius:14px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 12px rgba(255,117,140,0.3);">تغییر فیلم</button>
            </div>

            <div id="html5-player-box" class="player-container">
                <video id="player" playsinline controls></video>
            </div>

            <div id="iframe-player-box" class="iframe-container hidden">
                <iframe id="video-iframe" src="" allowfullscreen></iframe>
            </div>

            <div id="player-error" class="error-msg hidden">خطا در بارگذاری لینک. لطفاً لینک معتبر وارد کنید.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://crazyapp-9663a-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomKey = null;
        let myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
        let isSyncing = false;
        let currentLoadedUrl = "";

        const authSection = document.getElementById('auth-section');
        const roomSection = document.getElementById('room-section');
        const errorBox = document.getElementById('error-box');
        const videoInput = document.getElementById('video-url-input');
        const roomTitleDisplay = document.getElementById('room-title-display');
        const onlineUsersBadge = document.getElementById('online-users-badge');
        const playerError = document.getElementById('player-error');

        const html5Box = document.getElementById('html5-player-box');
        const iframeBox = document.getElementById('iframe-player-box');
        const videoIframe = document.getElementById('video-iframe');

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
        });

        function switchTab(tab) {
            errorBox.classList.add('hidden');
            const createTabBtn = document.getElementById('btn-create-tab');
            const joinTabBtn = document.getElementById('btn-join-tab');
            const createForm = document.getElementById('create-form');
            const joinForm = document.getElementById('join-form');

            if (tab === 'create') {
                createTabBtn.classList.add('active');
                joinTabBtn.classList.remove('active');
                createForm.classList.remove('hidden');
                joinForm.classList.add('hidden');
            } else {
                joinTabBtn.classList.add('active');
                createTabBtn.classList.remove('active');
                joinForm.classList.remove('hidden');
                createForm.classList.add('hidden');
            }
        }

        function sanitizeRoomName(name) {
            return name.trim().replace(/[.#$\/\[\]]/g, "_");
        }

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
        }

        function createRoom() {
            const roomName = document.getElementById('create-room-name').value.trim();
            const password = document.getElementById('create-room-pass').value.trim();

            if (!roomName || !password) {
                showError("لطفاً نام اتاق و رمز عبور را وارد کنید.");
                return;
            }

            const roomKey = sanitizeRoomName(roomName);
            const roomRef = db.ref('rooms/' + roomKey);

            const newRoomData = {
                password: password,
                videoUrl: "",
                currentTime: 0,
                paused: true,
                lastUpdated: Date.now()
            };

            roomRef.set(newRoomData).then(() => {
                enterRoom(roomKey, roomName);
            }).catch(err => {
                showError("خطا در ساخت اتاق: " + err.message);
            });
        }

        function joinRoom() {
            const roomName = document.getElementById('join-room-name').value.trim();
            const password = document.getElementById('join-room-pass').value.trim();

            if (!roomName || !password) {
                showError("لطفاً نام اتاق و رمز عبور را وارد کنید.");
                return;
            }

            const roomKey = sanitizeRoomName(roomName);
            const roomRef = db.ref('rooms/' + roomKey);

            roomRef.once('value').then((snapshot) => {
                const roomData = snapshot.val();
                if (!roomData) {
                    showError("اتاقی با این نام وجود ندارد!");
                    return;
                }
                if (roomData.password !== password) {
                    showError("رمز عبور اشتباه است!");
                    return;
                }
                enterRoom(roomKey, roomName);
            });
        }

        function enterRoom(key, name) {
            currentRoomKey = key;
            authSection.classList.add('hidden');
            roomSection.classList.remove('hidden');
            roomTitleDisplay.innerText = `اتاق: ${name}`;

            const userStatusRef = db.ref(`rooms/${key}/presence/${myUserId}`);
            userStatusRef.set(true);
            userStatusRef.onDisconnect().remove();

            db.ref(`rooms/${key}/presence`).on('value', (snap) => {
                const count = snap.numChildren();
                onlineUsersBadge.innerText = `👥 افراد حاضر: ${count} نفر`;
            });

            listenToRoomUpdates();
        }

        function parseVideoUrl(url) {
            if (!url) return { type: 'none', src: '' };
            
            if (url.includes('aparat.com')) {
                let match = url.match(/\/v\/([a-zA-Z0-9]+)/);
                if (match && match[1]) {
                    return { type: 'iframe', src: `https://www.aparat.com/video/video/embed/videohash/${match[1]}/vt/frame` };
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }
                if (videoId) {
                    return { type: 'iframe', src: `https://www.youtube.com/embed/${videoId}` };
                }
            }
            return { type: 'html5', src: url };
        }

        function loadVideoIntoPlayer(url) {
            if (currentLoadedUrl === url) return;
            currentLoadedUrl = url;

            const parsed = parseVideoUrl(url);
            playerError.classList.add('hidden');

            if (parsed.type === 'iframe') {
                html5Box.classList.add('hidden');
                iframeBox.classList.remove('hidden');
                videoIframe.src = parsed.src;
            } else if (parsed.type === 'html5') {
                iframeBox.classList.add('hidden');
                html5Box.classList.remove('hidden');
                player.source = {
                    type: 'video',
                    sources: [{ src: parsed.src, provider: 'html5' }]
                };
            } else {
                playerError.classList.remove('hidden');
            }
        }

        function updateVideoUrl() {
            const url = videoInput.value.trim();
            if (!url || !currentRoomKey) return;

            db.ref('rooms/' + currentRoomKey).update({
                videoUrl: url,
                currentTime: 0,
                paused: true,
                lastUpdated: Date.now()
            });
        }

        // ارسال فرمان‌ها به دیتابیس به همراه شناسه آخرین فرستنده
        player.on('play', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                paused: false,
                currentTime: player.currentTime,
                lastUpdated: Date.now(),
                sender: myUserId
            });
        });

        player.on('pause', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                paused: true,
                currentTime: player.currentTime,
                lastUpdated: Date.now(),
                sender: myUserId
            });
        });

        player.on('seeked', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                currentTime: player.currentTime,
                lastUpdated: Date.now(),
                sender: myUserId
            });
        });

        function listenToRoomUpdates() {
            const roomRef = db.ref('rooms/' + currentRoomKey);

            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // آپدیت آنی لینک ویدیو
                if (data.videoUrl && data.videoUrl !== currentLoadedUrl) {
                    videoInput.value = data.videoUrl;
                    loadVideoIntoPlayer(data.videoUrl);
                }

                isSyncing = true;

                // تنظیم زمان دقیق ویدیو روی دستگاه همه کاربران
                let timeDiff = Math.abs(player.currentTime - data.currentTime);
                if (timeDiff > 0.2) {
                    player.currentTime = data.currentTime;
                }
                
                // اعمال وضعیت Play یا Pause به صورت هماهنگ
                if (data.paused) {
                    if (!player.paused) {
                        player.pause();
                    }
                } else {
                    if (player.paused) {
                        // استفاده از متد استاندارد هندل خطای مرورگر برای پلی شدن خودکار
                        let playPromise = player.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.log("مرورگر اجازه پخش خودکار نداد، کاربر باید یکبار روی صفحه بزند.");
                            });
                        }
                    }
                }

                isSyncing = false;
            });
        }

        function leaveRoom() {
            if (currentRoomKey) {
                db.ref(`rooms/${currentRoomKey}/presence/${myUserId}`).remove();
                db.ref('rooms/' + currentRoomKey).off();
            }
            location.reload();
        }
    </script>
</body>
</html>
