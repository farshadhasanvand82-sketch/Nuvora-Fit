<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zeucball - نتایج زنده فوتبال</title>
    <!-- اضافه کردن کتابخانه Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --pitch-green-1: #0e3b1c;
            --pitch-green-2: #072210;
            --card-glass: rgba(10, 35, 18, 0.75);
            --border-glass: rgba(0, 255, 102, 0.35);
            --border-hover: rgba(0, 255, 102, 0.9);
            --neon-green: #00ff66;
            --live-red: #ff334b;
            --text-main: #f0fdf4;
            --text-sub: #86efac;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.15) 0%, transparent 70%), linear-gradient(135deg, var(--pitch-green-2) 0%, var(--pitch-green-1) 100%);
            --glow-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .app-container.theme-day {
            --pitch-green-1: #f1f5f9;
            --pitch-green-2: #cbd5e1;
            --card-glass: rgba(255, 255, 255, 0.9);
            --border-glass: rgba(59, 130, 246, 0.4);
            --neon-green: #2563eb;
            --text-main: #0f172a;
            --text-sub: #334155;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 70%), linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --glow-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
        }

        .app-container.theme-pink {
            --pitch-green-1: #fbcfe8; --pitch-green-2: #be185d;
            --card-glass: rgba(255, 182, 193, 0.45); --border-glass: rgba(244, 114, 182, 0.6);
            --neon-green: #f472b6; --text-main: #ffffff; --text-sub: #fbcfe8;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.2) 0%, transparent 70%), linear-gradient(135deg, #831843 0%, #be185d 100%);
            --glow-shadow: 0 0 20px rgba(244, 114, 182, 0.5);
        }

        .app-container.theme-esteghlal {
            --pitch-green-1: #003366; --pitch-green-2: #001226;
            --card-glass: rgba(0, 51, 102, 0.55); --border-glass: rgba(0, 191, 255, 0.6);
            --neon-green: #00d2ff; --text-main: #ffffff; --text-sub: #99d6ff;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.25) 0%, transparent 70%), linear-gradient(135deg, #000c1a 0%, #002b5c 100%);
            --glow-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .app-container.theme-persepolis {
            --pitch-green-1: #660000; --pitch-green-2: #260000;
            --card-glass: rgba(102, 0, 0, 0.55); --border-glass: rgba(255, 215, 0, 0.6);
            --neon-green: #ffd700; --text-main: #ffffff; --text-sub: #ffb3b3;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.2) 0%, transparent 70%), linear-gradient(135deg, #1a0000 0%, #5c0000 100%);
            --glow-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .app-container.theme-zlatan {
            --pitch-green-1: #1a1a1a; --pitch-green-2: #050505;
            --card-glass: rgba(20, 20, 20, 0.75); --border-glass: rgba(212, 175, 55, 0.6);
            --neon-green: #d4af37; --text-main: #ffffff; --text-sub: #e6c667;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.25) 0%, transparent 70%), linear-gradient(135deg, #050505 0%, #1f1f1f 100%);
            --glow-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .app-container.theme-dark_scary {
            --pitch-green-1: #200000; --pitch-green-2: #050000;
            --card-glass: rgba(25, 0, 0, 0.8); --border-glass: rgba(255, 0, 51, 0.6);
            --neon-green: #ff0033; --text-main: #ffffff; --text-sub: #ff8095;
            --bg-gradient: radial-gradient(circle at 50% 50%, rgba(255, 0, 51, 0.25) 0%, transparent 70%), linear-gradient(135deg, #050000 0%, #2b0000 100%);
            --glow-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #020503;
            color: var(--text-main);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            background: var(--bg-gradient);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            box-shadow: var(--glow-shadow);
            position: relative;
            transition: all 0.5s ease;
        }

        #topNotificationBanner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(10, 35, 18, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-green);
            color: var(--text-main);
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--neon-green);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            max-width: 90%;
        }

        #topNotificationBanner.show {
            transform: translateX(-50%) translateY(0);
        }

        #topNotificationBanner.red {
            background: rgba(255, 51, 75, 0.95);
            border-color: #ff334b;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px #ff334b;
        }

        #topNotificationBanner.green {
            background: rgba(0, 255, 102, 0.95);
            border-color: #00ff66;
            color: #030704;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px #00ff66;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
            background: rgba(0, 0, 0, 0.65);
            border-bottom: 1px solid var(--border-glass);
            z-index: 50;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: bold;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-icon {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cart-icon:hover {
            border-color: var(--neon-green);
            transform: scale(1.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid var(--border-glass);
            align-items: center;
            justify-content: center;
            z-index: 100;
            position: relative;
        }

        .custom-input {
            background: rgba(10, 30, 15, 0.85);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
            color-scheme: dark;
            cursor: pointer;
        }

        .custom-dropdown {
            position: relative;
            flex: 1;
            max-width: 220px;
            min-width: 140px;
            z-index: 999;
        }

        .dropdown-select-btn {
            background: rgba(10, 30, 15, 0.85);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
        }

        .dropdown-list {
            position: absolute;
            top: 115%;
            right: 0;
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(4, 18, 9, 0.98);
            backdrop-filter: blur(25px);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.95);
            display: none;
            z-index: 999999;
        }

        .dropdown-list.open { display: block; }

        .dropdown-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dropdown-item:hover {
            background: rgba(0, 255, 102, 0.25);
            color: var(--neon-green);
        }

        .btn-action {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.9) 0%, rgba(4, 120, 87, 0.9) 100%);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            padding: 0 15px;
            border-bottom: 1px solid var(--border-glass);
            gap: 8px;
            overflow-x: auto;
            z-index: 10;
        }

        .tab-btn {
            padding: 11px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--border-glass);
            color: var(--neon-green);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0; left: 0;
            height: 3px;
            background: var(--neon-green);
            border-radius: 3px 3px 0 0;
        }

        .content-area {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            z-index: 5;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 950px;
            margin: 0 auto;
        }

        .match-card {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 15px 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .league-name-tag {
            font-size: 0.8rem;
            color: var(--neon-green);
            font-weight: 700;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .team {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .team.home { text-align: left; }
        .team.away { text-align: right; }

        .score-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--border-glass);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--neon-green);
            min-width: 85px;
            text-align: center;
            flex-shrink: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .modal-content {
            background: rgba(10, 25, 15, 0.95);
            border: 1px solid var(--neon-green);
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: var(--glow-shadow);
            text-align: center;
            overflow: hidden;
        }

        .modal-body-scroll {
            flex: 1;
            overflow-y: auto;
            max-height: 65vh;
            padding-left: 4px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--neon-green);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-btn {
            background: var(--neon-green);
            color: #030704;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .theme-card {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-info h4 { color: var(--text-main); margin-bottom: 4px; text-align: right; }
        .theme-info p { font-size: 0.8rem; color: var(--text-sub); text-align: right; }
        .theme-actions { display: flex; gap: 6px; }

        .shop-menu-item {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .shop-menu-item:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 102, 0.2);
        }

        .btn-buy, .btn-preview, .btn-select {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }

        .btn-buy { background: #eab308; color: #000; }
        .btn-preview { background: #3b82f6; color: #fff; }
        .btn-select { background: #22c55e; color: #fff; }
        .btn-owned { background: rgba(255,255,255,0.2); color: #aaa; cursor: default; }

        .loading, .empty-msg {
            text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 1rem;
        }

        .game-tab-btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.4));
            border: 1px solid rgba(56, 189, 248, 0.6) !important;
            color: #38bdf8 !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }
        .game-tab-btn.active {
            background: linear-gradient(135deg, #0ea5e9, #0284c7) !important;
            color: #ffffff !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .game-setup-card {
            background: rgba(10, 35, 18, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 20px;
            padding: 20px;
            max-width: 520px;
            margin: 10px auto;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.2);
            text-align: center;
        }

        .player-list-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: right;
            padding: 5px;
        }

        .player-mini-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.8rem;
        }

        /* گزینه‌های انتخاب رنگ کیت */
        .kit-color-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .kit-color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .kit-color-option.selected {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 10px #ffffff;
        }

        /* زمین چمن شیشه‌ای و گرافیکی سه‌بعدی متحرک */
        .match-live-arena {
            width: 100%;
            max-width: 540px;
            height: 520px;
            background: radial-gradient(circle at 50% 50%, rgba(14, 101, 52, 0.9) 0%, rgba(7, 45, 22, 0.95) 100%), linear-gradient(180deg, #166534 0%, #14532d 100%);
            border: 2px solid rgba(56, 189, 248, 0.6);
            border-radius: 20px;
            margin: 0 auto 15px auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,255,102,0.2);
            backdrop-filter: blur(10px);
        }

        .pitch-line-center {
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.4);
        }
        .pitch-circle-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .smart-player-node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .player-kit-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .player-name-tag {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #ffffff;
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            margin-top: -3px;
        }

        .smart-ball {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            filter: drop-shadow(0 0 10px #00ff66);
            transition: all 0.5s ease-in-out;
            z-index: 20;
        }

        .match-commentary-box {
            background: rgba(10, 25, 15, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            max-width: 540px;
            margin: 0 auto;
            text-align: right;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="topNotificationBanner">📢 اعلان سیستم</div>

<div class="app-container" id="appContainer">
    <header>
        <div class="brand">⚽ zeucball</div>
        <div class="header-left">
            <div class="coin-badge">
                🪙 <span id="coinCount">50</span> سکه
            </div>
            <div class="cart-icon" onclick="openShopModal()">🛒</div>
        </div>
    </header>

    <div class="controls" id="topControlsBar">
        <input type="date" id="matchDate" class="custom-input" onchange="fetchMatchesByDate()">
        
        <div class="custom-dropdown" id="customDropdown">
            <div class="dropdown-select-btn" onclick="toggleDropdown()">
                <span id="selectedLeagueLabel">همه لیگ‌ها</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="dropdown-list" id="dropdownList">
                <div class="dropdown-item" onclick="selectLeague('ALL', 'همه لیگ‌ها')">همه لیگ‌ها</div>
            </div>
        </div>

        <button class="btn-action" onclick="fetchMatchesByDate()">بروزرسانی</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" onclick="switchStatusFilter('ALL', this)">همه بازی‌ها</button>
        <button class="tab-btn active" onclick="switchStatusFilter('LIVE', this)">بازی‌های زنده</button>
        <button class="tab-btn" onclick="switchStatusFilter('UPCOMING', this)">بازی‌های آینده</button>
        <button class="tab-btn" onclick="switchStatusFilter('FINISHED', this)">پایان‌یافته</button>
        <button class="tab-btn" onclick="switchStatusFilter('QUMAR', this)" style="color: #f43f5e;">🎰 قمار</button>
        <button class="tab-btn game-tab-btn" onclick="switchStatusFilter('GAME', this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px #38bdf8);"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
            GAME
        </button>
    </div>

    <div class="content-area">
        <div id="content">
            <div class="loading">در حال بارگذاری زمین مسابقه zeucball...</div>
        </div>
    </div>
</div>

            let res = await fetch(`${API_BASE}/api/matches/date/${formattedDate}`);
            if (!res.ok) res = await fetch(`${API_BASE}/api/matches/date/${dateVal}`);
            const json = await res.json();
            globalLeaguesData = json?.data?.leagues || json?.leagues || [];
            renderMatches();
        } catch (err) {
            console.error(err);
            if (currentStatusFilter !== 'QUMAR' || qumarSubView !== 'home') {
                contentDiv.innerHTML = '<div class="empty-msg">خطا در ارتباط با سرور zeucball.</div>';

    async function generateAndSaveUniquePlayers(teamName, kitColor) {
        let positions = ['دروازه‌بان', 'مدافع', 'مدافع', 'مدافع', 'مدافع', 'هافبک', 'هافبک', 'هافبک', 'مهاجم', 'مهاجم', 'مهاجم'];
        
        let { data: existingPlayers } = await supabaseClient.from('players').select('name');
        let usedNames = new Set(existingPlayers ? existingPlayers.map(p => p.name) : []);

        let newPlayers = [];
        positions.forEach((pos, idx) => {
            let fName = IRANIAN_FIRST_NAMES[Math.floor(Math.random() * IRANIAN_FIRST_NAMES.length)];
            let lName = IRANIAN_LAST_NAMES[Math.floor(Math.random() * IRANIAN_LAST_NAMES.length)];
            let fullName = `${fName} ${lName}`;
            while (usedNames.has(fullName)) {
                fName = IRANIAN_FIRST_NAMES[Math.floor(Math.random() * IRANIAN_FIRST_NAMES.length)];
                lName = IRANIAN_LAST_NAMES[Math.floor(Math.random() * IRANIAN_LAST_NAMES.length)];
                fullName = `${fName} ${lName}`;
            }
            usedNames.add(fullName);

            let power = Math.floor(Math.random() * 10) + 1;
            let skillName = 'مهارت';
            if (pos === 'دروازه‌بان') skillName = 'قدرت سیو';
            else if (pos === 'مدافع') skillName = 'قدرت دفاع';
            else if (pos === 'هافبک') skillName = 'قدرت بازی‌سازی';
            else if (pos === 'مهاجم') skillName = 'دریبل و گل‌زنی';

            newPlayers.push({
                user_id: userId,
                name: fullName,
                position: pos,
                power: power,
                skill_desc: skillName
            });
        });

        await supabaseClient.from('teams').upsert({ user_id: userId, team_name: teamName, kit_color: kitColor });
        await supabaseClient.from('players').insert(newPlayers);

        gameState = {
            configured: true,
            teamName: teamName,
            kitColor: kitColor,
            players: newPlayers
        };
        localStorage.setItem('zeuc_game_state', JSON.stringify(gameState));
    }

    async function saveGameSetup() {

    let matchLoopInterval = null;

    async function startMatchmaking() {
        if (matchmakingState.searching || matchmakingState.liveMatchActive) return;
        matchmakingState.searching = true;
        matchmakingState.secondsLeft = 60;
        renderMatches();

        let userTotalPower = gameState.players.reduce((sum, p) => sum + p.power, 0);

        await supabaseClient.from('match_queue').upsert({
            user_id: userId,
            team_name: gameState.teamName,
            total_power: userTotalPower
        });

        matchmakingState.timer = setInterval(async () => {
            matchmakingState.secondsLeft--;
            renderMatches();

            let { data: opponents } = await supabaseClient
                .from('match_queue')
                .select('*')
                .neq('user_id', userId)
                .limit(1);

            if (opponents && opponents.length > 0) {
                let opp = opponents[0];
                await supabaseClient.from('match_queue').delete().in('user_id', [userId, opp.user_id]);
                clearInterval(matchmakingState.timer);
                matchmakingState.searching = false;
                initLiveMatch(opp.team_name, opp.total_power, userTotalPower);
                return;
            }

            if (matchmakingState.secondsLeft <= 0) {
                clearInterval(matchmakingState.timer);
                await supabaseClient.from('match_queue').delete().eq('user_id', userId);
                matchmakingState.searching = false;
                initLiveMatch('شاهین رباتیک', Math.floor(userTotalPower * (0.8 + Math.random() * 0.4)), userTotalPower);
            }
        }, 1000);
    }

    async function cancelMatchmaking() {
        if (matchmakingState.timer) clearInterval(matchmakingState.timer);
        await supabaseClient.from('match_queue').delete().eq('user_id', userId);
        matchmakingState.searching = false;
        renderMatches();
    }

    function initLiveMatch(oppName, oppPower, userPower) {
        matchmakingState.liveMatchActive = true;

        let diff = userPower - oppPower;
        let userGoals = 0, oppGoals = 0;
        let randVal = Math.random() * 100;
        if (diff > 15) {
            userGoals = Math.floor(Math.random() * 3) + 1;
            oppGoals = Math.floor(Math.random() * 2);
        } else if (diff < -15) {
            userGoals = Math.floor(Math.random() * 2);
            oppGoals = Math.floor(Math.random() * 3) + 1;
        } else {
            if (randVal < 40) { userGoals = Math.floor(Math.random() * 2); oppGoals = userGoals; }
            else if (randVal < 70) { userGoals = Math.floor(Math.random() * 3) + 1; oppGoals = Math.floor(Math.random() * 2); }
            else { userGoals = Math.floor(Math.random() * 2); oppGoals = Math.floor(Math.random() * 3) + 1; }
        }

        matchmakingState.matchData = {
            homeTeam: gameState.teamName,
            awayTeam: oppName,
            homeScore: 0,
            awayScore: 0,
            targetHomeGoals: userGoals,
            targetAwayGoals: oppGoals,
            currentMinute: 0,
            half: 1,
            commentary: 'مسابقه آغاز شد! بازیکنان در زمین مستقر شدند.'
        };

        renderMatches();
        startLiveMatchEngine();
    }

    function startLiveMatchEngine() {
        if (matchLoopInterval) clearInterval(matchLoopInterval);

        let tick = 0;
        matchLoopInterval = setInterval(() => {
            if (!matchmakingState.liveMatchActive) {
                clearInterval(matchLoopInterval);
                return;
            }

            tick++;
            matchmakingState.matchData.currentMinute = tick;

            if (tick === 45) {
                matchmakingState.matchData.half = 2;
                matchmakingState.matchData.commentary = 'سوت پایان نیمه اول! بازیکنان برای استراحت کوتاه آماده می‌شوند.';
            } else if (tick === 90) {
                matchmakingState.matchData.commentary = 'سوت پایان مسابقه! نتیجه نهایی ثبت شد.';
                matchmakingState.liveMatchActive = false;
                clearInterval(matchLoopInterval);
            } else {
                let randomEvent = Math.random();
                let randomPlayer = gameState.players[Math.floor(Math.random() * gameState.players.length)].name;

                if (randomEvent < 0.15 && matchmakingState.matchData.homeScore < matchmakingState.matchData.targetHomeGoals) {
                    matchmakingState.matchData.homeScore++;
                    matchmakingState.matchData.commentary = `⚽ گل فوق‌العاده برای ${gameState.teamName} توسط ${randomPlayer}! (دقیقه ${tick})`;
                } else if (randomEvent > 0.85 && matchmakingState.matchData.awayScore < matchmakingState.matchData.targetAwayGoals) {
                    matchmakingState.matchData.awayScore++;
                    matchmakingState.matchData.commentary = `⚽ گل برای تیم ${matchmakingState.matchData.awayTeam}! (دقیقه ${tick})`;
                } else if (randomEvent < 0.4) {
                    matchmakingState.matchData.commentary = `⚡ پاسکاری زیبا در خط هافبک توسط ${randomPlayer}...`;
                } else if (randomEvent < 0.7) {
                    matchmakingState.matchData.commentary = `🛡️ دفاع محکم و دفع توپ توسط ${randomPlayer}.`;
                } else {
                    matchmakingState.matchData.commentary = `⏱️ جریان بازی در جریان است... (دقیقه ${tick})`;
                }
            }

            updatePitchAnimationPositions();
            renderMatches();
        }, 1000);
    }

    function updatePitchAnimationPositions() {
        const ballEl = document.getElementById('smartBallNode');
        if (ballEl) {
            let randX = 20 + Math.random() * 60;
            let randY = 15 + Math.random() * 70;
            ballEl.style.top = randY + '%';
            ballEl.style.left = randX + '%';
        }
    }

    function startEnfesharGame() {
        if (enfesharState.isPlaying) return;
        const betInput = document.getElementById('enfesharBetInput');
        const betVal = parseInt(betInput ? betInput.value : enfesharState.bet) || 10;

        if (betVal <= 0) {
            showTopBanner('لطفاً مقدار سکه معتبری برای شروع بازی وارد کنید!', 'red');
            return;
        }
        if (betVal > userCoins) {
            showTopBanner('موجودی سکه شما برای این مبلغ کافی نیست!', 'red');
            return;
        }

        enfesharState.bet = betVal;
        userCoins -= betVal;
        updateCoinUI();

        enfesharState.isPlaying = true;
        enfesharState.multiplier = 1.00;
        enfesharState.cashedOut = false;

        let rand = Math.random();
        if (rand < 0.12) {
            enfesharState.crashPoint = 1.00;
        } else {
            enfesharState.crashPoint = parseFloat((1.01 + Math.pow(Math.random(), 2.3) * 6.00).toFixed(2));
        }

        renderMatches();

        if (enfesharState.timer) clearInterval(enfesharState.timer);

        enfesharState.timer = setInterval(() => {
            if (!enfesharState.isPlaying) {
                clearInterval(enfesharState.timer);
                return;
            }

            enfesharState.multiplier += 0.01;
            let currentPercentage = Math.round((enfesharState.multiplier - 1) * 100);
            
            const displayEl = document.getElementById('enfesharMultiplierDisplay');
            if (displayEl) {
                displayEl.textContent = currentPercentage + '% (ضریب ' + enfesharState.multiplier.toFixed(2) + 'x)';
            }

            if (enfesharState.multiplier >= enfesharState.crashPoint) {
                clearInterval(enfesharState.timer);
                enfesharState.isPlaying = false;
                if (!enfesharState.cashedOut) {
                    showTopBanner(`💥 بازی منفجر شد روی ضریب ${enfesharState.multiplier.toFixed(2)}x! متأسفانه باختید.`, 'red');
                }
                renderMatches();
            }
        }, 100);
    }

    function cashoutEnfeshar() {
        if (!enfesharState.isPlaying || enfesharState.cashedOut) return;
        enfesharState.cashedOut = true;
        clearInterval(enfesharState.timer);
        enfesharState.isPlaying = false;

        let winnings = Math.floor(enfesharState.bet * enfesharState.multiplier);
        userCoins += winnings;
        updateCoinUI();

        let wonPercent = Math.round((enfesharState.multiplier - 1) * 100);
        showTopBanner(`🎉 تبریک! در درصد ${wonPercent}% (ضریب ${enfesharState.multiplier.toFixed(2)}x) برداشت کردید و ${winnings} سکه برنده شدید!`, 'green');
        renderMatches();
    }

    function setOutcomePick(matchId, pick) {
        if (userPredictions[matchId] && userPredictions[matchId].locked) return;
        if (!userPredictions[matchId]) userPredictions[matchId] = {};
        userPredictions[matchId].winnerPick = pick;
        localStorage.setItem('zeuc_predictions', JSON.stringify(userPredictions));
        renderMatches();
    }

    function saveFullPrediction(matchId) {
        if (userPredictions[matchId] && userPredictions[matchId].locked) {
            showTopBanner('این پیش‌بینی قبلاً ثبت شده و قابل تغییر نیست!', 'red');
            return;
        }

        const homeVal = document.getElementById(`h_${matchId}`).value;
        const awayVal = document.getElementById(`a_${matchId}`).value;
        const betInputVal = document.getElementById(`bet_${matchId}`).value;
        const wagerCoins = parseInt(betInputVal) || 0;

        if (wagerCoins > userCoins) {
            showTopBanner('مبلغ سکه وارد شده برای شرط‌بندی بیشتر از موجودی شماست!', 'red');
            return;
        }

        if (wagerCoins > 0) {
            userCoins -= wagerCoins;
            updateCoinUI();
        }

        if (!userPredictions[matchId]) userPredictions[matchId] = {};
        if (homeVal !== '' && awayVal !== '') {
            userPredictions[matchId].home = parseInt(homeVal);
            userPredictions[matchId].away = parseInt(awayVal);
        }

        userPredictions[matchId].wager = wagerCoins;
        userPredictions[matchId].locked = true;
        localStorage.setItem('zeuc_predictions', JSON.stringify(userPredictions));
        showTopBanner('پیش‌بینی و سرمایه‌گذاری سکه شما با موفقیت ثبت شد.', 'green');
        renderMatches();
    }

    function renderPredictionView(contentDiv, isSubView = false) {
        let allMatchesList = [];

        globalLeaguesData.forEach(league => {
            const leagueRaw = league.name || league.primaryId || 'مسابقات';
            const leagueNameFA = translateFA(leagueRaw);
            const matches = league.matches || league.events || [];

            matches.forEach((m, idx) => {
                let isUpcoming = true;
                if (m.status) {
                    if (typeof m.status === 'string') {
                        if (m.status.includes('پایان') || m.status.toLowerCase().includes('ft') || m.status.toLowerCase().includes('live') || m.status.toLowerCase().includes('started')) {
                            isUpcoming = false;
                        }
                    } else {
                        if (m.status.finished || m.status.started) {
                            isUpcoming = false;
                        }
                    }
                }

                let timestamp = m.status?.utcTime ? new Date(m.status.utcTime).getTime() : 0;
                let matchId = m.id || `${leagueNameFA}_${idx}_${timestamp}`;

                if (isUpcoming) {
                    allMatchesList.push({
                        matchId: matchId,
                        matchData: m,
                        leagueNameFA: leagueNameFA
                    });
                }
            });
        });

        let html = '<div class="matches-grid">';
        if (isSubView) {
            html += `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <button class="btn-action" onclick="backToQumarHome()" style="padding: 6px 14px; font-size: 0.8rem;">← بازگشت به منوی قمار</button>
                    <span style="font-size: 0.9rem; color: var(--neon-green); font-weight: bold;">🎯 بخش پیش‌بینی مسابقات واقعی آینده</span>
                </div>
            `;
        }
        html += '<p style="color:var(--neon-green); text-align:center; margin-bottom:10px;">🎯 پیش‌بینی رایگان (+۵ یا +۲۵ سکه) + قابلیت گذاشتن سکه دلخواه (دریافت ۳ برابر در صورت برد!):</p>';

        if (allMatchesList.length === 0) {
            contentDiv.innerHTML = html + '<div class="empty-msg">هیچ مسابقه شروع‌نشده‌ای برای تاریخ انتخابی یافت نشد. تاریخ دیگری را انتخاب کنید.</div></div>';
            return;
        }

        allMatchesList.forEach(item => {
            const m = item.matchData;
            const homeRaw = m.home?.name || m.homeTeam?.name || m.home || 'میزبان';
            const awayRaw = m.away?.name || m.awayTeam?.name || m.away || 'میهمان';
            const homeNameFA = translateFA(homeRaw);
            const awayNameFA = translateFA(awayRaw);
            const pKey = item.matchId;
            const savedPred = userPredictions[pKey] || { home: '', away: '', winnerPick: '', wager: 0, locked: false };

            html += `
                <div class="match-card">
                    <div class="card-top-bar">
                        <div class="league-name-tag">⚽ <span>${item.leagueNameFA}</span></div>
                    </div>
                    <div class="prediction-wrapper">
                        <div class="prediction-row">
                            <div class="team home"><span>${homeNameFA}</span></div>
                            <div class="exact-score-box">
                                <input type="number" id="h_${pKey}" class="pred-input" value="${savedPred.home ?? ''}" placeholder="گل" ${savedPred.locked ? 'disabled' : ''}>
                                <span>-</span>
                                <input type="number" id="a_${pKey}" class="pred-input" value="${savedPred.away ?? ''}" placeholder="گل" ${savedPred.locked ? 'disabled' : ''}>
                            </div>
                            <div class="team away"><span>${awayNameFA}</span></div>
                        </div>
                        <div class="bet-input-container">
                            <span>🪙 سکه دلخواه برای ۳ برابر کردن:</span>
                            <input type="number" id="bet_${pKey}" class="bet-input" value="${savedPred.wager || 0}" min="0" placeholder="تعداد" ${savedPred.locked ? 'disabled' : ''}>
                        </div>
                        <div class="outcome-btns">
                            <button class="btn-outcome ${savedPred.winnerPick === 'HOME' ? 'selected' : ''}" ${savedPred.locked ? 'disabled' : ''} onclick="setOutcomePick('${pKey}', 'HOME')">برد ${homeNameFA}</button>
                            <button class="btn-outcome ${savedPred.winnerPick === 'DRAW' ? 'selected' : ''}" ${savedPred.locked ? 'disabled' : ''} onclick="setOutcomePick('${pKey}', 'DRAW')">مساوی</button>
                            <button class="btn-outcome ${savedPred.winnerPick === 'AWAY' ? 'selected' : ''}" ${savedPred.locked ? 'disabled' : ''} onclick="setOutcomePick('${pKey}', 'AWAY')">برد ${awayNameFA}</button>
                        </div>
                        ${savedPred.locked ? 
                            `<div class="predicted-badge">✓ پیش‌بینی‌شده و قفل شده</div>` :
                            `<button class="btn-save-pred" onclick="saveFullPrediction('${pKey}')">ثبت قطعی پیش‌بینی</button>`
                        }
                    </div>
                </div>
            `;
        });
        html += '</div>';
        contentDiv.innerHTML = html;
    }
</script>

</body>
</html>
