<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماشای مشترک فیلم - Watch Together</title>
    <!-- بارگذاری فایربیس -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- بارگذاری پلی‌جی‌اس (Plyr) برای ظاهر شیشه‌ای و پشتیبانی کامل از انواع فرمت‌ها -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
    
    <style>
        :root {
            --bg-color: #0f0c1b;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary: #ff6584;
            --text-color: #ffffff;
            --plyr-color-main: #ff758c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff8fab;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        .player-container {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
        }

        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .error-msg {
            color: #ff4d4d;
            text-align: center;
            font-size: 13px;
            background: rgba(255, 0, 0, 0.1);
            padding: 8px;
            border-radius: 8px;
        }

        /* شخصی‌سازی استایل شیشه‌ای پلیر Plyr */
        .plyr {
            border-radius: 15px;
            max-height: 500px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بخش احراز هویت اتاق -->
        <div id="auth-section">
            <h3>ساخت یا ورود به اتاق مشترک</h3>
            <div class="form-group">
                <label>نام اتاق (انگلیسی):</label>
                <input type="text" id="room-name" placeholder="مثلاً: room1">
            </div>
            <div class="form-group">
                <label>رمز عبور اتاق:</label>
                <input type="password" id="room-pass" placeholder="رمز عبور">
            </div>
            <button onclick="joinOrCreateRoom()">ورود / ساخت اتاق</button>
            <div id="error-box" style="margin-top:10px;" class="error-msg"></div>
        </div>

        <!-- بخش اتاق و پلیر شیشه‌ای -->
        <div id="room-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="room-title-display" style="margin: 0;">اتاق: </h3>
                <button onclick="leaveRoom()" style="width: auto; padding: 5px 15px; background: #e74c3c; margin: 0;">خروج</button>
            </div>

            <div class="controls-bar">
                <input type="text" id="video-url-input" placeholder="لینک مستقیم ویدیو (پشتیبانی از mp4, mkv, webm و...)">
                <button onclick="updateVideoUrl()" style="width: 140px; margin-top: 0;">تغییر فیلم</button>
            </div>

            <div class="player-container">
                <video id="player" playsinline controls>
                    <source id="video-source" src="" type="video/mp4" />
                </video>
            </div>
            <div id="player-error" class="error-msg hidden">خطا: مرورگر شما قادر به پخش این فرمت یا لینک نیست. لطفاً از لینک مستقیم معتبر استفاده کنید.</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://crazyapp-9663a-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomKey = null;
        let isSyncing = false;

        const authSection = document.getElementById('auth-section');
        const roomSection = document.getElementById('room-section');
        const roomInput = document.getElementById('room-name');
        const passInput = document.getElementById('room-pass');
        const errorBox = document.getElementById('error-box');
        const videoInput = document.getElementById('video-url-input');
        const roomTitleDisplay = document.getElementById('room-title-display');
        const playerError = document.getElementById('player-error');

        // راه‌اندازی پلیر پیشرفته Plyr
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
        });

        function sanitizeRoomName(name) {
            return name.trim().replace(/[.#$\/\[\]]/g, "_");
        }

        function joinOrCreateRoom() {
            const roomName = roomInput.value.trim();
            const password = passInput.value.trim();

            if (!roomName || !password) {
                errorBox.innerText = "لطفاً نام اتاق و رمز عبور را وارد کنید.";
                return;
            }

            const roomKey = sanitizeRoomName(roomName);
            const roomRef = db.ref('rooms/' + roomKey);

            roomRef.once('value').then((snapshot) => {
                const roomData = snapshot.val();
                if (roomData) {
                    if (roomData.password === password) {
                        enterRoom(roomKey, roomName, roomData);
                    } else {
                        errorBox.innerText = "رمز عبور اشتباه است!";
                    }
                } else {
                    const newRoomData = {
                        password: password,
                        videoUrl: "",
                        currentTime: 0,
                        paused: true,
                        lastUpdated: Date.now()
                    };
                    roomRef.set(newRoomData).then(() => {
                        enterRoom(roomKey, roomName, newRoomData);
                    });
                }
            }).catch(err => {
                errorBox.innerText = "خطا در اتصال: " + err.message;
            });
        }

        function enterRoom(key, name, data) {
            currentRoomKey = key;
            authSection.classList.add('hidden');
            roomSection.classList.remove('hidden');
            roomTitleDisplay.innerText = `اتاق: ${name}`;

            if (data.videoUrl) {
                videoInput.value = data.videoUrl;
                player.source = {
                    type: 'video',
                    sources: [{ src: data.videoUrl, provider: 'html5' }]
                };
                player.currentTime = data.currentTime || 0;
            }

            listenToRoomUpdates();
        }

        function updateVideoUrl() {
            const url = videoInput.value.trim();
            if (!url || !currentRoomKey) return;

            playerError.classList.add('hidden');
            db.ref('rooms/' + currentRoomKey).update({
                videoUrl: url,
                currentTime: 0,
                paused: true,
                lastUpdated: Date.now()
            });
        }

        // مدیریت همگام‌سازی رویدادها با پلیر جدید
        player.on('play', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                paused: false,
                currentTime: player.currentTime,
                lastUpdated: Date.now()
            });
        });

        player.on('pause', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                paused: true,
                currentTime: player.currentTime,
                lastUpdated: Date.now()
            });
        });

        player.on('seeked', () => {
            if (isSyncing || !currentRoomKey) return;
            db.ref('rooms/' + currentRoomKey).update({
                currentTime: player.currentTime,
                lastUpdated: Date.now()
            });
        });

        function listenToRoomUpdates() {
            const roomRef = db.ref('rooms/' + currentRoomKey);

            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // به‌روزرسانی لینک ویدیو اگر تغییر کرده بود
                if (data.videoUrl && player.source !== data.videoUrl) {
                    if (videoInput.value !== data.videoUrl) {
                        videoInput.value = data.videoUrl;
                        player.source = {
                            type: 'video',
                            sources: [{ src: data.videoUrl, provider: 'html5' }]
                        };
                    }
                }

                isSyncing = true;
                // همگام‌سازی حالت پخش / توقف
                if (data.paused && player.playing) {
                    player.pause();
                } else if (!data.paused && player.paused) {
                    player.play().catch(e => console.log(e));
                }

                // همگام‌سازی زمان فیلم
                if (Math.abs(player.currentTime - data.currentTime) > 1.5) {
                    player.currentTime = data.currentTime;
                }
                isSyncing = false;
            });
        }

        function leaveRoom() {
            if (currentRoomKey) {
                db.ref('rooms/' + currentRoomKey).off();
            }
            location.reload();
        }
    </script>
</body>
</html>
